  // ---------- presence (true real-time, via Firebase connection state) ----------

  var presenceConnected = false;

  function registerPresence(){
    var m = me();
    if (!m || !presenceConnected) return;
    var myPresRef = db.ref("presence/" + m.id);
    myPresRef.onDisconnect().remove();
    myPresRef.set({
      name: m.name, tag: m.tag || "", color: m.color || "",
      ts: firebase.database.ServerValue.TIMESTAMP
    });
  }

  function setupPresence(){
    db.ref(".info/connected").on("value", function(snap){
      presenceConnected = snap.val() === true;
      if (presenceConnected) registerPresence();
    });
    db.ref("presence").on("value", function(snap){
      renderPresence(snap.val() || {});
    });
  }

  function renderPresence(presenceMap){
    var el = document.getElementById("presence-widget");
    if (!el) return;
    var ids = Object.keys(presenceMap);
    if (!ids.length){
      el.classList.add("hidden");
      el.innerHTML = "";
      return;
    }
    el.classList.remove("hidden");
    var mine = myId();
    var people = ids.map(function(id){
      var p = presenceMap[id];
      return { id: id, name: p.name, tag: p.tag, color: p.color };
    });
    var avatarsHtml = people.slice(0, 6).map(function(p){
      return '<span class="avatar" data-tip="' + escapeAttr(p.name) + '" style="background:' + (p.color || "var(--accent)") + '">' + escapeHtml(p.tag || initials(p.name)) + '</span>';
    }).join("");
    var label;
    if (people.length === 1){
      label = people[0].id === mine ? "just you, right now" : people[0].name + " is around";
    } else {
      label = people.length + " around right now";
    }
    el.innerHTML = '<span class="presence-dot"></span><span class="presence-avatars">' + avatarsHtml + '</span><span class="presence-label">' + escapeHtml(label) + '</span>';
  }

  function renderBrandSub(){
    var n = state.participants.filter(function(p){ return p.lastSeenTs; }).length;
    var total = state.participants.length;
    var text = n === 0 ? "Nobody's checked in yet" : n + " of " + total + " checked in";
    document.getElementById("trip-sub").textContent = text;
  }

  function renderAll(){
    renderOverview();
    renderListPanel("locations");
    renderDatesPanel();
    renderListPanel("lodging");
    renderFlights();
    renderItinerary();
    renderResources();
    renderBudget();
    renderIdentityChip();
    renderBrandSub();
    renderChat();
  }

  // ---------- events ----------

  function activateTab(key){
    document.querySelectorAll("nav.tabs button[data-tab]").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === key);
    });
    document.querySelectorAll(".panel").forEach(function(p){
      p.classList.toggle("active", p.id === "panel-" + key);
    });
  }
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-tab]");
    if (btn) activateTab(btn.dataset.tab);
  });

  var TAB_ORDER_KEY = "skitrip2027_taborder";

  function applySavedTabOrder(){
    var nav = document.getElementById("tabs");
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(TAB_ORDER_KEY) || "null"); } catch(e){}
    if (!saved || !Array.isArray(saved)) return;
    var buttons = Array.prototype.slice.call(nav.querySelectorAll("button[data-tab]"));
    var byKey = {};
    buttons.forEach(function(b){ byKey[b.dataset.tab] = b; });
    saved.forEach(function(key){ if (byKey[key]) nav.appendChild(byKey[key]); });
    buttons.forEach(function(b){ if (saved.indexOf(b.dataset.tab) === -1) nav.appendChild(b); });
  }

  function saveTabOrder(){
    var nav = document.getElementById("tabs");
    var order = Array.prototype.map.call(nav.querySelectorAll("button[data-tab]"), function(b){ return b.dataset.tab; });
    try { localStorage.setItem(TAB_ORDER_KEY, JSON.stringify(order)); } catch(e){}
  }

  applySavedTabOrder();

  nav_drag_delegate();
  function nav_drag_delegate(){
    var nav = document.getElementById("tabs");
    var dragBtn = null;

    nav.addEventListener("dragstart", function(e){
      var btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      dragBtn = btn;
      if (e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", btn.dataset.tab); } catch(err){}
      }
      btn.classList.add("dragging");
    });

    nav.addEventListener("dragend", function(){
      if (dragBtn) dragBtn.classList.remove("dragging");
      dragBtn = null;
      saveTabOrder();
    });

    nav.addEventListener("dragover", function(e){
      if (!dragBtn) return;
      var btn = e.target.closest("button[data-tab]");
      if (!btn || btn === dragBtn) return;
      e.preventDefault();
      var rect = btn.getBoundingClientRect();
      var before = (e.clientX - rect.left) < rect.width / 2;
      nav.insertBefore(dragBtn, before ? btn : btn.nextSibling);
    });

    nav.addEventListener("drop", function(e){
      if (!dragBtn) return;
      e.preventDefault();
      saveTabOrder();
      dragBtn = null;
    });
  }

  document.getElementById("identity-chip").addEventListener("click", function(){
    promptIdentity(true);
  });

  document.getElementById("activity-open").addEventListener("click", openActivityModal);
  document.getElementById("feature-open").addEventListener("click", openFeatureModal);

  document.getElementById("chat-fab").addEventListener("click", toggleChatPanel);
  document.getElementById("chat-minimize").addEventListener("click", closeChatPanel);
  document.getElementById("chat-send").addEventListener("click", function(){
    var input = document.getElementById("chat-input");
    sendChatMessage(input.value);
    input.value = "";
    input.focus();
  });
  document.getElementById("chat-input").addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); document.getElementById("chat-send").click(); }
  });

  document.getElementById("theme-toggle").addEventListener("click", function(){
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme") || "dark";
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("skitrip2027_theme", next); } catch(e){}
  });

  document.getElementById("modal-root").addEventListener("click", function(e){
    if (e.target.classList && e.target.classList.contains("modal-backdrop")){
      e.target.parentElement.innerHTML = "";
    }
  });

  function cardListKey(el){
    var host = el.closest("[data-list]");
    if (host) return host.dataset.list;
    var panel = el.closest(".panel");
    return panel ? panel.id.replace("panel-", "") : null;
  }

  main_click_delegate();
  function main_click_delegate(){
    document.querySelector("main").addEventListener("click", function(e){
      var t = e.target;
      var voteBtn = t.closest("[data-vote]");
      if (voteBtn){
        var panel = cardListKey(voteBtn);
        var list = state[panel];
        var item = list.find(function(i){ return i.id === voteBtn.dataset.vote; });
        var label = panel === "dates" && item ? fmtDateRange(item.start, item.end) : (item && item.name);
        toggleVote(list, voteBtn.dataset.vote, label);
        return;
      }
      var addBtn = t.closest("[data-add]");
      if (addBtn){
        if (addBtn.dataset.add === "dates") openDateModal(); else addOrEditItem(addBtn.dataset.add);
        return;
      }
      var editBtn = t.closest("[data-edit]");
      if (editBtn){
        var panel2 = cardListKey(editBtn);
        if (panel2 === "dates") openDateModal(editBtn.dataset.edit); else addOrEditItem(panel2, editBtn.dataset.edit);
        return;
      }
      var delBtn = t.closest("[data-del]");
      if (delBtn){
        var panel3 = cardListKey(delBtn);
        if (panel3 === "dates") deleteDateOption(delBtn.dataset.del); else deleteItem(panel3, delBtn.dataset.del);
        return;
      }
      if (t.closest("#add-expense")){ openExpenseModal(); return; }
      var editExp = t.closest("[data-editexp]");
      if (editExp){ openExpenseModal(editExp.dataset.editexp); return; }
      var delExp = t.closest("[data-delexp]");
      if (delExp){ deleteExpense(delExp.dataset.delexp); return; }
      var settleBtn = t.closest("[data-settle-exp]");
      if (settleBtn){ toggleSettled(settleBtn.dataset.settleExp, settleBtn.dataset.settlePerson); return; }
      var balanceToggle = t.closest("[data-balance-toggle]");
      if (balanceToggle){
        var bid = balanceToggle.dataset.balanceToggle;
        expandedBalances[bid] = !expandedBalances[bid];
        renderBudget();
        return;
      }
      var commentToggle = t.closest("[data-comment-toggle]");
      if (commentToggle){
        var cid = commentToggle.dataset.commentToggle;
        expandedComments[cid] = !expandedComments[cid];
        renderAll();
        return;
      }
      var commentAdd = t.closest("[data-comment-add]");
      if (commentAdd){
        var addInput = document.querySelector('[data-comment-input="' + commentAdd.dataset.commentAdd + '"]');
        addComment(commentAdd.dataset.commentAdd, addInput ? addInput.value : "");
        return;
      }
      var commentDel = t.closest("[data-comment-del]");
      if (commentDel){ deleteComment(commentDel.dataset.commentDel, commentDel.dataset.commentId); return; }
      if (t.closest("[data-add-flight]")){ openFlightModal(); return; }
      var editFlight = t.closest("[data-edit-flight]");
      if (editFlight){ openFlightModal(editFlight.dataset.editFlight); return; }
      var delFlight = t.closest("[data-del-flight]");
      if (delFlight){ deleteFlight(delFlight.dataset.delFlight); return; }
      if (t.closest("[data-add-day]")){ openDayModal(); return; }
      var editDay = t.closest("[data-edit-day]");
      if (editDay){ openDayModal(editDay.dataset.editDay); return; }
      var delDay = t.closest("[data-del-day]");
      if (delDay){ deleteDay(delDay.dataset.delDay); return; }
      var addMoment = t.closest("[data-add-moment]");
      if (addMoment){ openMomentModal(addMoment.dataset.addMoment); return; }
      var editMoment = t.closest("[data-edit-moment]");
      if (editMoment){ openMomentModal(editMoment.dataset.momentDay, editMoment.dataset.editMoment); return; }
      var delMoment = t.closest("[data-del-moment]");
      if (delMoment){ deleteMoment(delMoment.dataset.momentDay, delMoment.dataset.delMoment); return; }
      var calNav = t.closest("[data-cal-nav]");
      if (calNav){
        var dir = parseInt(calNav.dataset.calNav, 10);
        calView.month += dir;
        if (calView.month < 0){ calView.month = 11; calView.year--; }
        if (calView.month > 11){ calView.month = 0; calView.year++; }
        renderCalendar();
        return;
      }
      var calDay = t.closest("[data-date]");
      if (calDay){
        var iso = calDay.dataset.date;
        if (!pendingRange.start){
          pendingRange.start = iso;
          renderCalendar();
        } else if (!pendingRange.end){
          var s = pendingRange.start, e = iso;
          if (e < s){ var tmp = s; s = e; e = tmp; }
          pendingRange = { start: null, end: null };
          openDateModal(null, s, e);
        }
        return;
      }
      if (t.id === "cal-clear-pending"){ pendingRange = { start: null, end: null }; renderCalendar(); return; }
    });
    document.querySelector("main").addEventListener("keydown", function(e){
      if (e.key === "Enter" && e.target.matches && e.target.matches("[data-comment-input]")){
        addComment(e.target.dataset.commentInput, e.target.value);
      }
    });
  }

  main_drag_delegate();
  function main_drag_delegate(){
    var mainEl = document.querySelector("main");
    var dragState = null;

    function clearDragOver(){
      var prev = mainEl.querySelector(".drag-over");
      if (prev) prev.classList.remove("drag-over");
    }

    mainEl.addEventListener("dragstart", function(e){
      var card = e.target.closest("[data-drag-id]");
      if (!card) return;
      if (isGuest()){ e.preventDefault(); blockIfGuest(); return; }
      var listKey = cardListKey(card);
      dragState = { listKey: listKey, id: card.dataset.dragId };
      if (e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", card.dataset.dragId); } catch(err){}
      }
      card.classList.add("dragging");
    });

    mainEl.addEventListener("dragend", function(e){
      var card = e.target.closest("[data-drag-id]");
      if (card) card.classList.remove("dragging");
      clearDragOver();
      dragState = null;
    });

    mainEl.addEventListener("dragover", function(e){
      if (!dragState) return;
      var card = e.target.closest("[data-drag-id]");
      if (!card || cardListKey(card) !== dragState.listKey) return;
      e.preventDefault();
      if (card.dataset.dragId === dragState.id) return;
      clearDragOver();
      card.classList.add("drag-over");
    });

    mainEl.addEventListener("drop", function(e){
      if (!dragState) return;
      var card = e.target.closest("[data-drag-id]");
      clearDragOver();
      if (!card || card.dataset.dragId === dragState.id){ dragState = null; return; }
      e.preventDefault();
      var listKey = dragState.listKey;
      var draggedId = dragState.id;
      dragState = null;
      var list = state[listKey];
      var fromIdx = list.findIndex(function(i){ return i.id === draggedId; });
      if (fromIdx === -1) return;
      var rect = card.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height / 2;
      var moved = list.splice(fromIdx, 1)[0];
      var targetIdx = list.findIndex(function(i){ return i.id === card.dataset.dragId; });
      if (targetIdx === -1) targetIdx = list.length;
      list.splice(after ? targetIdx + 1 : targetIdx, 0, moved);
      logActivity("reordered " + (LIST_CONFIG[listKey] ? LIST_CONFIG[listKey].title.toLowerCase() : listKey));
      scheduleSave();
    });
  }

  // ---------- boot ----------

  function backfillState(){
    // Firebase Realtime Database silently omits any field that's an empty
    // array/object when it's written, so every field we treat as always
    // being an array/object needs to be restored here if it's missing.
    if (!state.trip) state.trip = JSON.parse(JSON.stringify(DEFAULT_STATE.trip));
    if (!state.participants) state.participants = JSON.parse(JSON.stringify(DEFAULT_STATE.participants));
    state.participants.forEach(function(p){
      var r = ROSTER.find(function(x){ return x.id === p.id; });
      if (r){
        p.tag = r.tag;
        p.color = r.color;
      }
    });
    ["locations", "dates", "lodging"].forEach(function(key){
      state[key] = state[key] || [];
      state[key].forEach(function(item){
        item.votes = item.votes || [];
        item.comments = item.comments || [];
      });
    });
    state.flights = state.flights || [];
    state.flights.forEach(function(f){ f.people = f.people || []; });
    if (!state.itinerary) state.itinerary = [];
    state.itinerary.forEach(function(day){
      day.moments = day.moments || [];
    });
    state.expenses = state.expenses || [];
    state.expenses.forEach(function(e){
      e.splitAmong = e.splitAmong || [];
      e.settledBy = e.settledBy || [];
    });
    if (!state.activity) state.activity = [];
    if (!state.featureRequests) state.featureRequests = [];
    state.featureRequests.forEach(function(r){ r.votes = r.votes || []; });
    if (!state.chat) state.chat = [];
    if (!state.gear) state.gear = JSON.parse(JSON.stringify(DEFAULT_STATE.gear));
    if (!state.glossary) state.glossary = JSON.parse(JSON.stringify(DEFAULT_STATE.glossary));
  }

  function startApp(){
    startSync();
    setupPresence();
  }

  // ---------- password gate ----------
  // Soft gate only (client-side, not real security) — just keeps this off
  // search engines and randos, not a safe for anything sensitive.

  var GATE_PASSWORD = "copper";
  var GATE_KEY = "skitrip2027_gate_ok";

  function wireGate(){
    var gate = document.getElementById("password-gate");
    var input = document.getElementById("gate-input");
    var errorEl = document.getElementById("gate-error");
    function tryEnter(){
      var val = (input.value || "").trim().toLowerCase();
      if (val === GATE_PASSWORD){
        try { localStorage.setItem(GATE_KEY, "1"); } catch(e){}
        gate.classList.add("hidden");
      } else {
        errorEl.classList.remove("hidden");
        input.value = "";
        input.focus();
      }
    }
    document.getElementById("gate-submit").onclick = tryEnter;
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") tryEnter(); });
    input.focus();
  }

  (function checkGate(){
    var ok = false;
    try { ok = localStorage.getItem(GATE_KEY) === "1"; } catch(e){}
    if (ok){
      document.getElementById("password-gate").classList.add("hidden");
    } else {
      wireGate();
    }
  })();

  startApp();
})();
</script>
